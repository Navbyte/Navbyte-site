<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NAVBYTE TECHNOLOGIES – Pro AV Cables, Connectors & Mounts</title>
<style>
:root{--bg:#fff;--bg2:#f2f7ff;--tx:#0b1b33;--mu:#5b6b85;--b:#1557ff;--b2:#0a3fd1;--bd:#e1e8f5;--card:#fff;--sh:0 8px 30px rgba(21,87,255,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--bg2:#101a30;--tx:#e8eefc;--mu:#9fb0cf;--bd:#223256;--card:#111c34;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--bg2:#101a30;--tx:#e8eefc;--mu:#9fb0cf;--bd:#223256;--card:#111c34;--sh:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.back{background:var(--bg2);color:var(--b);border:0;border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;transition:.2s}.back:hover{background:var(--b);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;color:var(--b);font-size:18px;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--b),#4aa3ff);display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px;animation:pulse 3s infinite}
.logo small{display:block;font-size:10px;letter-spacing:3px;color:var(--mu);font-weight:600;margin-top:-3px}
nav{margin-left:auto;display:flex;gap:6px;align-items:center}nav a{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--mu);transition:.2s}nav a:hover,nav a.on{background:var(--bg2);color:var(--b)}
.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;transition:.25s;box-shadow:0 6px 18px rgba(21,87,255,.28)}.btn:hover{background:var(--b2);transform:translateY(-2px)}
.btn.o{background:transparent;color:var(--b);border:1.5px solid var(--b);box-shadow:none}.btn.o:hover{background:var(--bg2)}
.burger{display:none;margin-left:auto;background:var(--bg2);border:0;border-radius:10px;width:42px;height:42px;font-size:20px;color:var(--b)}
.wrap{max-width:1200px;margin:auto;padding:0 20px}
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg2),var(--bg));padding:70px 0 50px}
.blob{position:absolute;border-radius:50%;filter:blur(50px);opacity:.35;animation:float 9s ease-in-out infinite}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.06;margin:0 0 16px;letter-spacing:-1.5px}h1 b{color:var(--b)}
.lead{color:var(--mu);font-size:18px;max-width:540px}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.stats{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}.stats b{font-size:28px;color:var(--b);display:block}.stats span{color:var(--mu);font-size:13px}
.orb{aspect-ratio:1;position:relative;display:grid;place-items:center}
.orb .ring{position:absolute;inset:8%;border:2px dashed var(--b);border-radius:50%;opacity:.35;animation:spin 24s linear infinite}
.orb .ring.r2{inset:22%;animation-duration:16s;animation-direction:reverse}
.chip3{position:absolute;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px;animation:float 6s ease-in-out infinite}
.chip3 span{color:var(--b)}
.core{width:44%;aspect-ratio:1;border-radius:30%;background:linear-gradient(135deg,var(--b),#4aa3ff);display:grid;place-items:center;color:#fff;font-size:clamp(40px,8vw,76px);box-shadow:0 20px 60px rgba(21,87,255,.4);animation:pulse 4s infinite}
section{padding:54px 0}h2{font-size:clamp(26px,3.6vw,38px);margin:0 0 6px;letter-spacing:-.8px}.sub{color:var(--mu);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;transition:.3s;display:flex;flex-direction:column;cursor:pointer}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh);border-color:var(--b)}
.card .im{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;overflow:hidden;position:relative}
.card .im img{width:100%;height:100%;padding:30px;object-fit:contain;transition:transform .5s}.card:hover .im img{transform:scale(1.08)}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{margin:0;font-size:15.5px;line-height:1.3}
.tag{font-size:12px;color:var(--mu)}.lens{display:flex;flex-wrap:wrap;gap:5px}.lens em{font-style:normal;font-size:11.5px;background:var(--bg2);color:var(--b);padding:2px 8px;border-radius:999px;font-weight:600}
.card .btn{margin-top:auto;padding:9px 12px;font-size:14px}
.cat .im{aspect-ratio:16/10}.cat .cnt{position:absolute;right:10px;top:10px;background:var(--b);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.gh{display:flex;align-items:center;gap:12px;margin:34px 0 16px}.gh h3{margin:0;font-size:21px}.gh:after{content:"";flex:1;height:1px;background:var(--bd)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tools input{flex:1;min-width:200px;padding:12px 16px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.tools input:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 4px rgba(21,87,255,.12)}
.crumb{color:var(--mu);font-size:14px;margin-bottom:10px}.crumb a{color:var(--b);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.steps div{padding:22px;border-radius:18px;background:var(--bg2)}.steps b{color:var(--b);font-size:30px}
footer{background:#0a2a8f;color:#cfdcff;padding:40px 0;margin-top:30px}footer .wrap{display:flex;gap:30px;justify-content:space-between;flex-wrap:wrap}footer b{color:#fff}
.mask{position:fixed;inset:0;background:rgba(5,15,40,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex;animation:fade .25s}.modal{background:var(--card);border-radius:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;position:relative;animation:pop .35s cubic-bezier(.2,1.3,.4,1);display:grid;grid-template-columns:1fr 1fr}
.modal.one{grid-template-columns:1fr;max-width:480px;padding:26px}.modal .pic{background:#fff;display:grid;place-items:center;padding:18px;min-height:0}.modal .pic img{width:auto;height:auto;max-width:130px;max-height:120px;object-fit:contain;border-radius:12px}
.modal .inf{padding:26px}.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg2);color:var(--tx);font-size:18px;z-index:2}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.opts button{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 13px;font-weight:600;transition:.2s}.opts button.s{background:var(--b);border-color:var(--b);color:#fff;transform:scale(1.05)}
.f{display:grid;gap:10px;margin:14px 0}.f input,.f textarea{padding:11px 14px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.vl{font-size:12px;color:var(--mu);max-height:96px;overflow:auto;margin:-8px 0 14px}.vl b{color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:40px}
@keyframes float{50%{transform:translateY(-14px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.06)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media(max-width:820px){.nav{gap:10px;padding:10px 14px}.logo{font-size:13px}.logo small{display:none}.back{padding:7px 11px;font-size:14px}.burger{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px 20px 18px;border-bottom:1px solid var(--bd);align-items:stretch}nav.open{display:flex}.hero .wrap{grid-template-columns:1fr}.orb{max-width:300px;margin:auto}.modal{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card .bd{padding:10px 12px 12px}.card h3{font-size:14px}.hero{padding:44px 0 30px}section{padding:36px 0}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}

const run=()=>{Q=$('#gs').value.trim().toLowerCase();const pl=$('#pl');
if(Q){const r=[];C.forEach(c=>c.p.forEach(p=>{if((p.n+' '+c.name+' '+p.d+' '+p.l.join(' ')).toLowerCase().includes(Q))r.push([p,c])}));pl.innerHTML=r.length?`<div class="grid">${r.slice(0,60).map(([p,c])=>pcard(p,c)).join('')}</div>`+(r.length>60?`<p class="empty">Showing 60 of ${r.length}. Refine your search.</p>`:''):'<p class="empty">No products found.</p>'}
else pl.innerHTML=groups.map(g=>`<div class="gh rv"><h3>${esc(g)}</h3></div><div class="grid">${C.filter(c=>c.g===g).map(catCard).join('')}</div>`).join('');rv()};
$('#gs').oninput=run;run()}
const reg=[];function pcard(p,c){reg.push([p,c]);const k=reg.length-1;return `<div class="card rv" onclick="prod(${k})"><div class="im"><img loading="lazy" src="${pimg(p,c)}" alt="${esc(p.n)}"></div><div class="bd"><h3>${esc(p.n)}</h3>${p.d?`<div class="tag">${esc(p.d.slice(0,70))}</div>`:''}${p.l.length>1?`<div class="lens">${p.l.slice(0,3).map(l=>`<em>${esc(l)}</em>`).join('')}${p.l.length>3?`<em>+${p.l.length-3} more</em>`:''}</div>`:''}<button class="btn" onclick="event.stopPropagation();prod(${k})">Enquire Now</button></div></div>`}
function cat(id){const c=C.find(c=>c.id===id);if(!c)return home();reg.length=0;
app.innerHTML=`<section><div class="wrap"><div class="crumb"><a href="#products">Products</a> / ${esc(c.g)} / ${esc(c.name)}</div><h2>${esc(c.name)}</h2><p class="sub">${c.p.length} products · select a product to choose lengths and enquire.</p><div class="tools"><input id="cs" placeholder="Filter ${esc(c.name)}…"></div><div id="cl"></div><div style="text-align:center;margin-top:24px"><button class="btn o" id="mo" style="display:none">Show more</button></div></div></section>`;
const draw=()=>{const q=$('#cs').value.trim().toLowerCase(),list=c.p.filter(p=>!q||(p.n+p.s+p.d+p.l.join(' ')).toLowerCase().includes(q));reg.length=0;const sh=list.slice(0,PP);let secs=[],last;
sh.forEach(p=>{if(!secs.length||p.s!==last){secs.push({t:p.s,h:''});last=p.s}secs[secs.length-1].h+=pcard(p,c)});
$('#cl').innerHTML=secs.map(x=>(x.t?`<div class="gh"><h3>${esc(x.t)}</h3></div>`:'')+`<div class="grid">${x.h}</div>`).join('');if(!list.length)$('#cl').innerHTML='<p class="empty">No matches.</p>';
$('#mo').style.display=list.length>PP?'inline-block':'none';$('#mo').textContent=`Show more (${list.length-PP} left)`;rv()};
$('#cs').oninput=()=>{PP=24;draw()};$('#mo').onclick=()=>{PP+=24;draw()};PP=24;draw()}
let sel=new Set(),cur=null;
function prod(k){cur=reg[k];sel=new Set();const [p,c]=cur;$('#mm').className='modal';
$('#mm').innerHTML=`<button class="x" onclick="cl()">✕</button><div class="pic"><img src="${pimg(p,c)}" alt=""></div><div class="inf"><div class="tag">${esc(c.name)}${p.s?' · '+esc(p.s):''}</div><h2 style="font-size:24px;margin:4px 0 8px">${esc(p.n)}</h2>${p.d?`<p style="color:var(--mu);margin:0 0 8px">${esc(p.d)}</p>`:''}<p class="tag">${p.w?'Warranty: '+esc(p.w)+' · ':''}One product, many options. Tap the size / length / type you need.</p>
${p.l.length?`<b>Choose size / length / type</b><div class="opts">${p.l.map((l,i)=>`<button onclick="tg(this,${i})">${esc(l)}</button>`).join('')}</div>${p.x?`<div class="vl">${p.l.map((l,i)=>p.x[i]?`<div><b>${esc(l)}</b> – ${esc(p.x[i])}</div>`:'').join('')}</div>`:''}`:''}<button class="btn" style="width:100%" onclick="enq(1)">Enquire Now</button></div>`;
$('#m').classList.add('on')}
function tg(b,i){const l=cur[0].l[i];sel.has(l)?sel.delete(l):sel.add(l);b.classList.toggle('s')}
function cl(){$('#m').classList.remove('on')}
function enq(fromProd){const t=fromProd&&cur?cur[0].n+(sel.size?' – lengths: '+[...sel].join(', '):' – (length to be confirmed)'):'';
$('#mm').className='modal one';$('#mm').innerHTML=`<button class="x" onclick="cl()">✕</button><h2 style="font-size:24px">Enquire Now</h2><p class="sub" style="margin-bottom:6px">${t?esc(t):'Tell us what you need.'}</p><div class="f"><input id="en" placeholder="Your name"><input id="ep" placeholder="Phone / WhatsApp" inputmode="tel"><input id="eq" placeholder="Quantity"><textarea id="ee" rows="3" placeholder="Message (optional)"></textarea></div><div class="row" style="margin:0"><button class="btn" style="flex:1" onclick="snd('wa','${esc(t).replace(/'/g,"\\'")}')">WhatsApp</button><button class="btn o" style="flex:1" onclick="snd('ml','${esc(t).replace(/'/g,"\\'")}')">Email</button></div>`;$('#m').classList.add('on')}
function snd(w,t){const m=`Enquiry for NAVBYTE TECHNOLOGIES\n${t?'Product: '+t+'\n':''}Name: ${$('#en').value}\nPhone: ${$('#ep').value}\nQty: ${$('#eq').value}\n${$('#ee').value}`;
if(w==='wa')window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(m),'_blank');else location.href='mailto:'+MAIL+'?subject='+encodeURIComponent('Product enquiry')+'&body='+encodeURIComponent(m)}
$('#m').onclick=e=>{if(e.target.id==='m')cl()};document.onkeydown=e=>{if(e.key==='Escape')cl()};
function goBack(){history.length>1?history.back():location.href='index.html'}
$('#bg').onclick=()=>$('#nv').classList.toggle('open');
home();if(history.length<=1)document.getElementById('bk').style.display='none';
</script></body></html>
